<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>역사 DM - 1·2학기 통합</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--line:#e5e8ed;--text:#20242a;--muted:#747b85;--mine:#6f46ff;--bubble:#f0f1f4;--soft:#f7f8fa;--ok:#1e8e5a;--warn:#b36b00}
*{box-sizing:border-box} body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#f7f8fa,#eef1f5);color:var(--text)}
.app{max-width:1240px;margin:auto;padding:18px}.top{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 20px;box-shadow:0 8px 22px rgba(0,0,0,.04)}
.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ffb34b,#ff5c71,#704cff);display:grid;place-items:center;color:#fff;font-weight:900}h1{margin:0;font-size:25px}.sub{margin-top:4px;color:var(--muted);font-size:13px}.status{margin-left:auto;font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#eef8f2;color:var(--ok)}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:16px}.sidebar,.chat{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.04)}.sidebar{padding:16px;height:fit-content}.label{font-size:12px;font-weight:900;color:var(--muted);margin:4px 0 8px}.topic{font-size:16px;font-weight:900;padding:11px 12px;border-radius:12px;background:#f6f3ff;color:#4e3bd3}.tabs{display:flex;gap:7px;margin:14px 0 10px}.tab{flex:1;border:none;border-radius:10px;padding:9px;background:#eef0f3;font-weight:900;cursor:pointer}.tab.active{background:#111;color:#fff}.qbox{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fbfbfc}.qtype{font-size:12px;color:#6257ff;font-weight:900;margin-bottom:6px}.qtext{font-size:15px;line-height:1.55;font-weight:760}.person{display:flex;gap:10px;align-items:center;border:1px solid #c9c5ff;background:#f8f7ff;border-radius:14px;padding:10px;margin-top:8px}.ring{width:42px;height:42px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#ffbd50,#ff5c70,#754cff);flex:none}.inner{width:100%;height:100%;border-radius:50%;background:white;overflow:hidden}.avatarimg{width:100%;height:100%;object-fit:cover;display:block}.pname{font-size:14px;font-weight:900}.pdesc{font-size:12px;color:var(--muted);margin-top:2px}.answer{margin-top:14px}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;resize:vertical}.savehint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.45}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.nav button{border:none;border-radius:11px;padding:10px 12px;font-weight:850;cursor:pointer}.prev{background:#eceff3}.next{background:#111;color:#fff}
.chat{min-height:760px;overflow:hidden;display:flex;flex-direction:column}.head{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.headmain{flex:1}.headname{font-size:15px;font-weight:900}.handle{font-size:12px;color:var(--muted);margin-top:2px}.body{display:flex;flex-direction:column;flex:1;min-height:0}.scroll{flex:1;overflow:auto;padding:15px 16px 8px}.profile{text-align:center;padding:6px 0 12px}.bigring{width:86px;height:86px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ffbd50,#ff5c70,#754cff);margin:0 auto 9px}.biginner{width:100%;height:100%;border-radius:50%;background:#f7f8fa;overflow:hidden}.bigavatar{width:100%;height:100%;object-fit:cover;display:block}.profilename{font-weight:900}.profilemeta{font-size:12px;color:var(--muted);margin-top:7px}.profilebio{max-width:520px;margin:10px auto 0;font-size:13px;line-height:1.55;color:#4e535a}.profiletags{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:10px}.profiletag{font-size:11px;padding:5px 9px;border-radius:999px;background:#f3f5ff;color:#5848c8;border:1px solid #e2defe}.verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#4b8df8;color:#fff;font-size:10px;margin-left:4px;vertical-align:1px}.system{text-align:center;color:#8a8f98;font-size:12px;line-height:1.5;margin:5px 0 9px}.date{text-align:center;color:#a0a4aa;font-size:11px;margin:8px 0}.msg{display:flex;gap:8px;align-items:flex-end;margin:9px 0}.msg.mine{justify-content:flex-end}.mini{width:24px;height:24px;border-radius:50%;background:#e7e9ed;overflow:hidden;flex:none;border:1px solid #eceef2}.mini img{width:100%;height:100%;object-fit:cover;display:block}.bubble{max-width:73%;border-radius:18px;padding:10px 13px;font-size:14px;line-height:1.58;white-space:pre-wrap}.other .bubble{background:var(--bubble);border-bottom-left-radius:5px}.mine .bubble{background:var(--mine);color:#fff;border-bottom-right-radius:5px}.typing{display:none;align-items:center;gap:6px;margin:8px 0 3px 32px;color:#999;font-size:12px}.typing.show{display:flex}.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#999;margin-right:2px;animation:b 1s infinite alternate}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}@keyframes b{to{transform:translateY(-2px);opacity:.4}}
.quick{padding:8px 14px;display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid #f1f1f2}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer}.quick button:disabled{opacity:.55;cursor:wait}.inputbar{border-top:1px solid var(--line);padding:10px 12px 12px}.input{display:flex;align-items:center;gap:8px;border:1px solid #d8dce2;border-radius:28px;padding:7px 9px}.camera{width:31px;height:31px;border-radius:50%;background:var(--mine);color:#fff;display:grid;place-items:center}.input input{flex:1;border:none;outline:none;font:inherit;min-width:0}.send{border:none;background:none;color:#545cff;font-weight:900;cursor:pointer}.send:disabled{color:#aaa}.error{background:#fff5f3!important;color:#9a2f23!important;border:1px solid #f2c8c2}.depth{font-size:11px;color:#9a9fa7;margin:4px 14px 8px;text-align:right}


.studentpilot{margin-top:12px;padding:10px 12px;border:1px dashed #d7dbe2;border-radius:12px;background:#fafbfc}
.loginState{font-size:12px;line-height:1.45;color:var(--muted)}
.loginState.ok{color:var(--ok);font-weight:800}
.loginState.err{color:#b33a2d;font-weight:800}
.evidenceInput{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;background:#fff}
.submitwrap{margin-top:9px}
.submitAnswer{width:100%;border:none;border-radius:11px;padding:11px 12px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#704cff,#5c55ff);color:#fff}
.submitAnswer:disabled{opacity:.55;cursor:wait}
.saveState{font-size:11px;margin-top:7px;line-height:1.45;color:var(--muted)}
.saveState.ok{color:var(--ok);font-weight:800}.saveState.err{color:#b33a2d;font-weight:800}
.evidenceWrap{margin-top:9px}
.evidenceInput{min-height:62px;resize:vertical}
@media(max-width:800px){.layout{grid-template-columns:1fr}.chat{min-height:650px}}




.backTopicBtn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:999px;
  padding:9px 13px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  text-decoration:none;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}
.backTopicBtn:hover{background:#f7f5ff;border-color:#cfc4ff}


</style>
</head>
<body>
<div class="app">
<section class="top"><div class="brand"><div class="logo">DM</div><div><h1>역사 DM</h1><div class="sub" id="appSubtitle"></div></div><div class="status" id="serverStatus">OpenAI 연결 준비</div></div></section>


<div style="margin:12px 0 0 2px">
  <button id="backToTopics" class="backTopicBtn" type="button">← 주제 선택</button>
</div>
<div class="layout">
<aside class="sidebar">
 <div class="label">오늘의 주제</div><div class="topic" id="topicTitle"></div>
 <div class="tabs"><button class="tab active" data-q="0">Q1</button><button class="tab" data-q="1">Q2</button><button class="tab" data-q="2">Q3</button></div>
 <div class="qbox"><div class="qtype" id="qType"></div><div class="qtext" id="qText"></div></div>
 <div style="margin-top:14px"><div class="label">대화 상대</div><div class="person"><div class="ring"><div class="inner"><img class="avatarimg" data-persona-avatar src="" alt="역사 해설자 프로필"></div></div><div><div class="pname"><span id="sideName"></span> <span class="verified">✓</span></div><div class="pdesc" id="sideDesc"></div></div></div></div>
 <div class="studentpilot">
   <div class="label">로그인 정보</div>
   <div class="loginState" id="loginState">메인페이지 로그인 정보를 확인하는 중입니다.</div>
 </div>
 <div class="answer"><div class="label">나의 답</div><textarea id="answer" placeholder="대화를 바탕으로 학습지에 쓸 답을 자신의 말로 정리해보세요."></textarea>
   <div class="evidenceWrap"><div class="label">내가 이렇게 생각한 근거</div><textarea class="evidenceInput" id="evidence" placeholder="어떤 내용이나 근거를 바탕으로 그렇게 생각했는지 한두 문장으로 적어보세요."></textarea></div>
   <div class="submitwrap"><button class="submitAnswer" id="submitAnswer">나의 답 제출하기</button><div class="saveState" id="saveState">제출하면 역사인터뷰답안 시트에 저장됩니다.</div></div>
 </div>
 <div class="nav"><button class="prev" id="prev">← 이전</button><button class="next" id="next">다음 →</button></div>
</aside>
<section class="chat">
 <div class="head"><div style="font-size:20px">←</div><div class="ring"><div class="inner"><img class="avatarimg" data-persona-avatar src="" alt="역사 해설자 프로필"></div></div><div class="headmain"><div class="headname"><span id="headName"></span> <span class="verified">✓</span></div><div class="handle" id="headHandle"></div></div><div style="font-size:18px">☎︎ ◉</div></div>
 <div class="body">
  <div class="scroll" id="scroll">
   <div class="profile"><div class="bigring"><div class="biginner"><img class="bigavatar" data-persona-avatar src="" alt="역사 해설자 프로필 이미지"></div></div><div class="profilename"><span id="profileName"></span> <span class="verified">✓</span></div><div class="profilemeta" id="profileMeta"></div><div class="profilebio" id="profileBio"></div><div class="profiletags" id="profileTags"></div></div>
   <div class="system" id="systemNotice"></div><div class="date">오늘</div>
   <div id="messages"></div><div class="typing" id="typing"><div class="mini"><img data-persona-avatar src="" alt="역사 해설자"></div><div class="dots"><span></span><span></span><span></span></div><span>답변을 작성하고 있어요...</span></div>
  </div>
  <div class="quick" id="quick"></div><div class="depth" id="depth">Q1 · 사실 확인 중심</div>
  <div class="inputbar"><div class="input"><div class="camera">✦</div><input id="free" maxlength="300" placeholder="메시지 보내기..."><button class="send" id="send">전송</button></div></div>
 </div>
</section>
</div>
</div>

    function questions() { return persona().questions; }

    function currentQuestion() { return questions()[qIndex]; }
    function avatarSrc() {
      const asset = $(persona().avatarAssetId);
      return asset ? asset.src : "";
    }


    function applyPersonaUI() {
      const p = persona();
      document.querySelectorAll("[data-persona-avatar]").forEach((img) => {
        img.src = avatarSrc();
        img.alt = p.name;
      });
      $("appSubtitle").textContent = p.appSubtitle;
      $("topicTitle").textContent = p.topicTitle;
      $("sideName").textContent = p.name;
      $("sideDesc").textContent = p.sideDescription;
      $("headName").textContent = p.name;
      $("headHandle").textContent = p.profileHandle + " · " + p.typeLabel;
      $("profileName").textContent = p.name;
      $("profileMeta").textContent = p.profileHandle + " · " + p.role;
      $("profileBio").textContent = p.bio;
      $("profileTags").innerHTML = p.tags.map((t) => '<span class="profiletag">' + t + '</span>').join("");
      $("systemNotice").innerHTML = p.systemNotice;
    }


    function addMessage(type, message, extraClass) {
      const row = document.createElement("div");
      row.className = "msg " + type;


      if (type === "other") {
        const av = document.createElement("div");
        av.className = "mini";
        const img = document.createElement("img");
        img.src = avatarSrc();
        img.alt = persona().name;
        av.appendChild(img);
        row.appendChild(av);
      }


      const bubble = document.createElement("div");
      bubble.className = "bubble" + (extraClass ? " " + extraClass : "");
      bubble.textContent = message;
      row.appendChild(bubble);


      $("messages").appendChild(row);
      $("scroll").scrollTop = $("scroll").scrollHeight;
    }


    function updateButtons() {
      $("prev").disabled = qIndex === 0 || waiting;
      $("next").disabled = qIndex === 2 || waiting;


      document.querySelectorAll("#quick button").forEach((b) => {
        b.disabled = waiting;
      });


      const chatReady = state().started[qIndex] && !waiting;
      $("send").disabled = !chatReady;
      $("free").disabled = !chatReady;
      $("free").placeholder = state().started[qIndex]
        ? persona().inputPlaceholder
        : persona().waitingPlaceholder;
    }


    function renderQuickButtons() {
      $("quick").innerHTML = "";


      if (!state().started[qIndex]) {
        const start = document.createElement("button");
        start.className = "startChatBtn";
        start.textContent = persona().startButtonLabel;
        start.addEventListener("click", startCurrentQuestion);
        $("quick").appendChild(start);
        return;
      }


      currentQuestion().quick.forEach((text) => {

        button.textContent = text;
        button.addEventListener("click", function () {
          sendMessage(text);
        });
        $("quick").appendChild(button);
      });
    }


    function renderQuestion() {
      const s = state();
      const q = currentQuestion();


      $("qType").textContent = q.type;
      $("qText").textContent = q.text;
      $("depth").textContent = q.depth;


      $("answer").value = s.answers[qIndex] || "";
      $("evidence").value = s.evidences[qIndex] || "";


      document.querySelectorAll(".tab").forEach((b, i) => {
        b.classList.toggle("active", i === qIndex);
      });


      $("messages").innerHTML = "";


      if (s.histories[qIndex].length === 0) {
        s.histories[qIndex].push({
          type: "other",
          text: q.greeting,
          systemGreeting: true
        });
      }


      s.histories[qIndex].forEach((m) => {
        addMessage(m.type, m.text, m.error ? "error" : "");
      });


      renderQuickButtons();
      updateButtons();
    }


    function buildServerHistory() {
      return state().histories[qIndex]
        .filter((m) => !m.error && !m.systemGreeting)
        .slice(-6)
        .map((m) => ({
          role: m.type === "mine" ? "user" : "assistant",
          text: m.text
        }));
    }


    async function sendToAI(message) {
      if (waiting) return;


      waiting = true;
      updateButtons();
      $("typing").classList.add("show");
      $("serverStatus").textContent = "AI 답변 중";


      try {
        const payload = {
          personaId: persona().personaId,
          personaName: persona().name,
          toneTemplate: persona().toneTemplate || "",
          message: message,
          questionType: ["Q1", "Q2", "Q3"][qIndex],
          worksheetQuestion: currentQuestion().text,
          history: buildServerHistory()
        };


        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });


        const raw = await response.text();
        const data = JSON.parse(raw);


        if (!data.ok) {
          throw new Error(data.error || "AI 서버 오류");
        }


        state().histories[qIndex].push({ type: "other", text: data.answer });
        addMessage("other", data.answer);
        $("serverStatus").textContent = "OpenAI 연결 정상";
        $("serverStatus").style.color = "var(--ok)";
      } catch (error) {
        const messageText =
          "지금 AI 서버와 연결하지 못했어요. 잠시 뒤 다시 질문해 주세요.\n(" +
          String(error.message || error) +
          ")";
        state().histories[qIndex].push({
          type: "other",
          text: messageText,
          error: true
        });
        addMessage("other", messageText, "error");
        $("serverStatus").textContent = "연결 확인 필요";
        $("serverStatus").style.color = "var(--warn)";
      } finally {
        $("typing").classList.remove("show");
        waiting = false;
        updateButtons();
      }
    }


    function startCurrentQuestion() {
      if (waiting || state().started[qIndex]) return;


      const q = currentQuestion();
      state().started[qIndex] = true;
      state().histories[qIndex].push({ type: "mine", text: q.dm });
      addMessage("mine", q.dm);
      renderQuickButtons();
      updateButtons();
      sendToAI(q.dm);
    }


    function sendMessage(text) {
      if (!state().started[qIndex] || waiting) return;


      const message = (text || $("free").value || "").trim();
      if (!message) return;


      state().histories[qIndex].push({ type: "mine", text: message });
      addMessage("mine", message);
      $("free").value = "";
      sendToAI(message);
    }


    function saveCurrentDraft() {
      state().answers[qIndex] = $("answer").value;
      state().evidences[qIndex] = $("evidence").value;
    }


    function switchTopic(id) {
      if (!TOPICS[id] || waiting) return;
      saveCurrentDraft();
      topicId = id;
      qIndex = 0;
      applyPersonaUI();
      renderQuestion();
    }


    function safeStorageGet(key) {
      try {
        return window.localStorage ? localStorage.getItem(key) : "";
      } catch (_) {
        return "";
      }
    }


    function getStudentSession() {
      const p = new URLSearchParams(window.location.search);
      const studentNo = safeStorageGet("studentNo") || p.get("studentNo") || "";
      const studentName = safeStorageGet("studentName") || p.get("studentName") || "";
      const fallbackId = studentNo && studentName ? studentNo + "_" + studentName : "";
      const studentId = safeStorageGet("studentId") || p.get("studentId") || fallbackId;


      return {
        studentNo: String(studentNo).trim(),
        studentName: String(studentName).trim(),
        studentId: String(studentId).trim()
      };
    }


    function renderLoginState() {
      const session = getStudentSession();
      const el = $("loginState");


      if (session.studentNo && session.studentName && session.studentId) {
        el.className = "loginState ok";
        el.textContent = "✓ " + session.studentNo + " " + session.studentName + " 학생으로 연결되었습니다.";
      } else {
        el.className = "loginState err";
        el.textContent = "메인페이지에서 학번과 이름으로 로그인한 뒤 이용해주세요.";
      }
    }


    function submitViaBridge(data) {
      return new Promise((resolve, reject) => {
        const requestId =
          "histdm_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);


        const timeout = setTimeout(() => {
          pendingSaves.delete(requestId);
          reject(new Error("저장 서버 응답 시간이 초과되었습니다."));
        }, 30000);


        pendingSaves.set(requestId, { resolve, reject, timeout });


        const form = document.createElement("form");
        form.method = "POST";
        form.action = RECORD_GAS_URL;
        form.target = "saveBridgeFrame";
        form.style.display = "none";


        const payload = Object.assign({}, data, {
          action: "bridgeSave",
          requestId: requestId
        });


        Object.keys(payload).forEach((key) => {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = String(payload[key] == null ? "" : payload[key]);
          form.appendChild(input);
        });


        document.body.appendChild(form);
        form.submit();
        setTimeout(() => form.remove(), 1000);
      });
    }




    function waitMs(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }


    function saveInterviewByForm(payload) {
      return new Promise((resolve, reject) => {
        const frameName = "historyDmSaveFrame_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
        const iframe = document.createElement("iframe");
        iframe.name = frameName;
        iframe.style.display = "none";
        document.body.appendChild(iframe);


        const form = document.createElement("form");
        form.method = "GET";
        form.action = INTERVIEW_RECORD_SERVER_URL;
        form.target = frameName;
        form.style.display = "none";


        const data = Object.assign({}, payload, {
          action: "saveInterview",
          _: Date.now().toString()
        });


        Object.keys(data).forEach((key) => {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = String(data[key] == null ? "" : data[key]);
          form.appendChild(input);
        });


        document.body.appendChild(form);


        let submitted = false;
        let finished = false;
        let timer = null;


        const cleanup = () => {
          if (finished) return;
          finished = true;
          if (timer) clearTimeout(timer);
          setTimeout(() => {
            try { form.remove(); } catch (e) {}
            try { iframe.remove(); } catch (e) {}
          }, 500);
        };


        iframe.addEventListener("load", () => {
          if (!submitted || finished) return;
          cleanup();
          resolve({ status: "ok", via: "form" });
        });


        timer = setTimeout(() => {
          if (finished) return;
          cleanup();
          reject(new Error("저장 서버 응답 시간이 초과되었습니다."));
        }, 20000);


        submitted = true;
        form.submit();
      });
    }


    async function saveInterviewAnswerReliable(payload) {
      let lastError = null;


      for (let attempt = 1; attempt <= 2; attempt++) {
        try {
          const result = await saveInterviewAnswerJsonp(payload);
          if (result && result.status === "ok") return result;
          throw new Error((result && result.message) || "저장 서버가 정상 응답을 보내지 않았습니다.");
        } catch (error) {
          lastError = error;
          if (attempt < 2) await waitMs(900);
        }
      }


      try {
        return await saveInterviewByForm(payload);
      } catch (formError) {
        throw new Error(
          "저장 서버 연결에 실패했습니다. " +
          String((lastError && lastError.message) || formError.message || formError)
        );
      }
    }




    function updateHistoryDmHubCache(topicId, topicTitle, questionId) {
      try {
        const key = "historyHubStateV1";
        const studentId = localStorage.getItem("studentId") || "";
        let hub = JSON.parse(localStorage.getItem(key) || "null");


        if (!hub || !hub.student || hub.student.studentId !== studentId) return;


        if (!hub.historyDM) {
          hub.historyDM = { submittedCount: 0, topics: {}, lastUpdatedAt: null };
        }
        if (!hub.historyDM.topics) hub.historyDM.topics = {};


        if (!hub.historyDM.topics[topicId]) {
          hub.historyDM.topics[topicId] = {
            topicId: topicId,
            topicTitle: topicTitle,
            submittedQuestions: [],
            lastUpdatedAt: null
          };
        }


        const topic = hub.historyDM.topics[topicId];
        if (!Array.isArray(topic.submittedQuestions)) topic.submittedQuestions = [];


        if (!topic.submittedQuestions.includes(questionId)) {
          topic.submittedQuestions.push(questionId);
          hub.historyDM.submittedCount = Number(hub.historyDM.submittedCount || 0) + 1;
        }


        topic.submittedQuestions.sort();
        topic.lastUpdatedAt = new Date().toISOString();
        hub.historyDM.lastUpdatedAt = topic.lastUpdatedAt;
        hub.loadedAt = Date.now();


        localStorage.setItem(key, JSON.stringify(hub));
      } catch (e) {
        console.warn("역사 DM 허브 캐시 갱신 오류", e);
      }
    }




    function currentTopicSubmittedQuestions() {
      try {
        const hub = JSON.parse(localStorage.getItem("historyHubStateV1") || "null");
        const studentId = localStorage.getItem("studentId") || "";
        if (!hub || !hub.student || hub.student.studentId !== studentId) return [];
        const t = hub.historyDM && hub.historyDM.topics
          ? hub.historyDM.topics[persona().id]
          : null;
        return t && Array.isArray(t.submittedQuestions) ? t.submittedQuestions : [];
      } catch (e) {
        return [];
      }
    }


    function updateDmClassCompletionUi() {
      const ws = new URLSearchParams(location.search).get("hubWorksheet") || "";
      if (!ws) return;


      const submitted = currentTopicSubmittedQuestions();
      let box = document.getElementById("hubDmCompletionBox");
      if (!box) {
        box = document.createElement("div");
        box.id = "hubDmCompletionBox";
        box.style.cssText =
          "margin-top:10px;padding:10px 12px;border-radius:12px;" +
          "background:#f6f4ff;border:1px solid #ddd6ff;color:#5847b9;" +
          "font-size:12px;font-weight:800;line-height:1.5";
        $("saveState").insertAdjacentElement("afterend", box);
      }


      const done = ["Q1","Q2","Q3"].filter(q => submitted.includes(q)).length;
      if (done >= 3) {
        box.innerHTML =
          "✓ 오늘 역사 DM 3/3 제출 완료 " +
          '<button id="hubDmHomeBtn" type="button" style="margin-left:8px;border:0;border-radius:10px;padding:7px 10px;background:#171c28;color:white;font-weight:900;cursor:pointer">🏠 역사 학습실로 이동 →</button>';
        const btn = document.getElementById("hubDmHomeBtn");
        if (btn) btn.onclick = () => location.href = "index.html?from=history_dm&refresh=" + Date.now();
      } else {
        box.textContent = "오늘 역사 DM 제출 " + done + "/3 · Q1, Q2, Q3을 모두 제출하면 완료됩니다.";
      }
    }


    async function submitAnswer() {
      if (saveWaiting) return;


      saveCurrentDraft();
      const session = getStudentSession();


      if (!session.studentNo || !session.studentName || !session.studentId) {
        $("saveState").className = "saveState err";
        $("saveState").textContent =
          "메인페이지 로그인 정보가 없습니다. 메인에서 로그인한 뒤 다시 이용해주세요.";
        return;
      }


      if (!state().answers[qIndex].trim()) {
        $("saveState").className = "saveState err";
        $("saveState").textContent = "‘나의 답’을 작성한 뒤 제출해주세요.";
        return;
      }


      saveWaiting = true;
      $("submitAnswer").disabled = true;
      $("saveState").className = "saveState";
      $("saveState").textContent = "답안을 저장하고 있어요...";


      try {
        const q = currentQuestion();


        const savePayload = {
          type: "interviewAnswer",
          studentNo: session.studentNo,
          studentName: session.studentName,
          studentId: session.studentId,
          topicId: persona().id,
          topicTitle: persona().topicTitle,
          questionId: ["Q1", "Q2", "Q3"][qIndex],
          questionType: q.type,
          worksheetQuestion: q.text,
          answer: state().answers[qIndex],
          evidence: state().evidences[qIndex]
        };


        const saveResult = await saveInterviewAnswerReliable(savePayload);


        if (!saveResult || saveResult.status !== "ok") {
          throw new Error(
            (saveResult && saveResult.message) || "저장에 실패했습니다."
          );
        }


        const submittedQuestionId = ["Q1", "Q2", "Q3"][qIndex];
        updateHistoryDmHubCache(
          persona().id,
          persona().topicTitle,
          submittedQuestionId
        );
        updateDmClassCompletionUi();


        $("saveState").className = "saveState ok";
        $("saveState").textContent =
          "✓ " + submittedQuestionId +
          " 답안이 구글시트에 저장되었습니다. 다시 제출하면 최종본으로 갱신됩니다.";
      } catch (error) {
        $("saveState").className = "saveState err";
        $("saveState").textContent = "저장 실패: " + String(error.message || error);
      } finally {
        saveWaiting = false;
        $("submitAnswer").disabled = false;
      }
    }


    window.addEventListener("message", function (event) {
      const data = event.data || {};
      if (data.source !== "timeExplorerSaveBridge" || !data.requestId) return;


      const pending = pendingSaves.get(data.requestId);
      if (!pending) return;


      clearTimeout(pending.timeout);
      pendingSaves.delete(data.requestId);


      if (data.status === "ok") pending.resolve(data);
      else pending.reject(new Error(data.message || "저장에 실패했습니다."));
    });


    document.querySelectorAll(".tab").forEach((button, i) => {
      button.addEventListener("click", function () {
        if (waiting) return;
        saveCurrentDraft();
        qIndex = i;
        renderQuestion();
      });
    });


    $("prev").addEventListener("click", function () {
      if (qIndex > 0 && !waiting) {
        saveCurrentDraft();
        qIndex -= 1;
        renderQuestion();
      }
    });


    $("next").addEventListener("click", function () {
      if (qIndex < 2 && !waiting) {
        saveCurrentDraft();
        qIndex += 1;
        renderQuestion();
      }
    });


    $("send").addEventListener("click", function () {
      sendMessage();
    });


    $("free").addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });


    $("answer").addEventListener("input", function () {
      state().answers[qIndex] = $("answer").value;
    });


    $("evidence").addEventListener("input", function () {
      state().evidences[qIndex] = $("evidence").value;
    });


    $("submitAnswer").addEventListener("click", submitAnswer);


    const backToTopicsBtn = $("backToTopics");
    const hubWorksheetId = new URLSearchParams(location.search).get("hubWorksheet") || "";
    if (backToTopicsBtn && hubWorksheetId) {
      backToTopicsBtn.textContent = "← 역사 학습실";
    }
    if (backToTopicsBtn) {
      backToTopicsBtn.addEventListener("click", function () {
        if (waiting || saveWaiting) return;


        const hasDraft =
          ($("answer").value || "").trim() !== "" ||
          ($("evidence").value || "").trim() !== "";


        if (hasDraft) {
          const ok = window.confirm(
            "아직 제출하지 않은 답안이 있을 수 있어요. 주제 선택 화면으로 돌아갈까요?"
          );
          if (!ok) return;
        }


        window.location.href = hubWorksheetId ? "index.html" : TOPIC_SELECT_URL;
      });
    }




    applyPersonaUI();
    renderLoginState();
    renderQuestion();
    $("serverStatus").textContent = "OpenAI 연결 준비";
  } catch (error) {
    console.error(error);
    showFatal(String(error && error.message ? error.message : error));
  }
});


window.addEventListener("error", function (event) {
  console.error("History DM error:", event.error || event.message);
});
</script>

window.addEventListener("load", function(){
  try{
    setTimeout(function(){
      if(typeof updateDmClassCompletionUi === "function") updateDmClassCompletionUi();
    }, 250);
  }catch(e){}
});
</script>
