</style></head><body><div class="shell"><header class="header"><div class="brand">✦ HISTORY QUIZ · 역사 서고</div><div class="nav"><button id="homeTop">처음으로</button><a href="../" id="hub">⌂ 역사 학습실</a></div></header><main class="scene"><span class="lantern a" aria-hidden="true">🏮</span><span class="lantern b" aria-hidden="true">🏮</span><section id="welcome" class="frame intro"><div class="mascot-panel"><img class="mascot" src="assets/crane-welcome-new.png" alt="책을 읽는 귀여운 학 마스코트"></div><div class="scroll"><img class="welcome-emblems" src="assets/title-four-emblems.png" alt="역사책, 두루마리, 모래시계, 전통 등불 장식"><div class="kicker">책 속의 역사를 탐험하는 시간</div><h1>역사 <em>퀴즈</em> 챌린지</h1><p class="subtitle">역사 서고의 지혜를 깨워 보세요!</p><button class="big-btn" id="goSetup">서고 입장하기 ❯</button></div></section><section id="setup" class="frame page hide"><div class="page-header"><h2 id="settingTitle">학습 범위 선택</h2><span class="step-note" id="settingStep">1 / 4</span></div><div class="setting-layout"><div class="paper"><h3 id="settingHeading">📚 학습 범위</h3><p id="settingHint">문제를 풀고 싶은 범위를 선택하세요.</p><div id="settingsContents"></div><div class="foot"><button class="mini-btn" id="previous">← 이전</button><button class="mini-btn next" id="next">다음으로 →</button></div></div><div class="settings-mascot"><div class="speech" id="craneSpeech">어떤 역사책을 펼쳐볼까요?</div><img src="assets/crane-read-new.png" alt="귀여운 학 마스코트"></div></div></section><section id="playing" class="frame hide"><div class="test"><div class="topstats"><div class="badge" id="counter">문제 1 / 10</div><div class="badge" id="streak">연속 정답 0</div><div class="badge clock" id="clock">10.0초</div></div><div class="timer-lane"><div class="book-start" aria-label="출발"><img src="assets/lane-start.png" alt="역사책 출발점"></div><div class="lane-bar"><div class="lane-fill" id="bar"></div></div><div class="bird-run" id="runner"><img id="craneQuiz" src="assets/crane-read-new.png" alt="달리는 학"></div><div class="goal" aria-label="목표"><img src="assets/lane-goal.png" alt="전통 등불 도착점"></div></div><div class="topic" id="topic"></div><div class="q-card" id="question"></div><div class="answers" id="answers"></div><div class="bottomtest"><span id="feedback" class="feedback" aria-live="polite"></span><button class="quit" id="quit">도전 종료</button></div></div></section><section id="result" class="frame page hide"><div class="scroll"><div class="kicker" style="text-align:center">역사 서고 학습 결과</div><div class="result-layout"><img class="result-mascot" src="assets/crane-result-new.png" alt="학 마스코트"><div><div class="rank-name" id="rank">대통</div><div class="rank-meaning" id="meaning">역사 내용을 매우 뛰어나게 익혔어요.</div><div class="rank-detail" id="resultMessage"></div></div></div><div class="score-strip"><div><span>정답률</span><b id="percent">0%</b></div><div><span>정답</span><b id="correct">0</b></div><div><span id="thirdLabel">오답</span><b id="wrong">0</b></div></div><div class="result-actions"><button class="mini-btn" id="newScope">범위 다시 선택</button><button class="mini-btn" id="retryWrong">틀린 문제 복습</button><button class="mini-btn next" id="retry">다시 도전</button></div></div></section></main></div><div id="modal" class="modal hide"><div class="modal-body"><button class="mini-btn modal-close" id="modalClose">닫기 ✕</button><h3 id="modalTitle">학습 범위 선택</h3><div id="modalItems" class="selection-list"></div><p class="notice">여러 주제를 선택할 수 있습니다.</p><button class="big-btn" id="modalDone" style="margin-top:10px">선택 완료</button></div></div><script src="questions.js"></script><script>
(()=>{'use strict';const Q=window.HISTORY_QUESTIONS||[],$=id=>document.getElementById(id);const lessons=[...new Set(Q.map(x=>x.lesson))];const units=[...new Set(Q.map(x=>x.unit))];const setting={scope:'all',selected:new Set(),seconds:10,mode:'normal',count:10};const state={step:0,idx:0,session:[],wrong:[],correct:0,streak:0,best:0,lock:false,raf:0,review:false,startTime:0,endlessSeen:new Set()};const stage=['welcome','setup','playing','result'];const rankList=[['대통(大通)','역사 지식을 매우 뛰어나게 익혔어요!','훌륭해요! 역사 서고의 지혜를 충분히 깨웠어요.'],['통(通)','역사 지식을 충분히 익혔어요!','멋져요! 조금만 더 복습하면 대통에 도전할 수 있어요.'],['약통(略通)','역사 지식의 핵심을 어느 정도 익혔어요!','좋아요! 틀린 문제를 다시 풀며 실력을 키워 보세요.'],['조통(粗通)','역사 지식을 조금 더 공부할 필요가 있어요.','핵심 내용을 다시 확인한 뒤 도전해 보세요.'],['불통(不通)','기초부터 차근차근 다시 도전해 보세요!','역사 서고의 첫 장부터 함께 읽어 보아요.']];function show(page){for(let id of stage)$(id).classList.toggle('hide',id!==page);window.scrollTo(0,0)}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function setOpts(group,options,get,select){return '<div class="tiles">'+options.map(o=>`<button type="button" class="tile ${group==='mode'&&o.value==='0'?'endless-card ':''}${get()===o.value?'active':''}" data-${group}="${o.value}"><span class="icon">${o.icon}</span><strong>${o.name}</strong><small>${o.desc}</small></button>`).join('')+'</div>'}const scopes=[{value:'all',name:'전체 범위',desc:'1·2학기 전체',icon:'<img src="assets/art-book.png" alt="">'},{value:'unit',name:'단원별 선택',desc:'단원 단위로 고르기',icon:'<img src="assets/art-scroll.png" alt="">'},{value:'lesson',name:'차시별 선택',desc:'학습지 차시로 고르기',icon:'<img src="assets/art-shelf.png" alt="">'},{value:'multi',name:'자유 선택',desc:'여러 차시 함께 선택',icon:'<img src="assets/art-school.png" alt="">'}];function selectedText(){if(setting.scope==='all')return '1·2학기 전체';if(!setting.selected.size)return '범위 선택 필요';return [...setting.selected].length>2?[...setting.selected].slice(0,2).join(', ')+' 외 '+(setting.selected.size-2)+'개':[...setting.selected].join(', ')}function setupUI(){const t=['학습 범위 선택','제한 시간 선택','도전 방식 선택','응시표 확인'],h=['학습 범위','제한 시간','도전 방식','과거시험 응시표'],tips=['문제를 풀고 싶은 범위를 선택하세요.','한 문제에 사용할 시간을 선택하세요.','한 번의 터치로 도전 방식을 선택하세요.','설정을 확인하고 시험장에 입장하세요.'];$('settingTitle').textContent=t[state.step];$('settingStep').textContent=(state.step+1)+' / 4';$('settingHeading').innerHTML='<img class="step-illustration" src="assets/'+['header-scope.png','header-time.png','header-mode.png','header-ticket.png'][state.step]+'" alt="">'+h[state.step];$('settingHint').textContent=tips[state.step];$('craneSpeech').textContent=['어떤 역사책을 펼쳐볼까요?','천천히 또는 빠르게 풀어봐요!','오늘은 얼마나 도전할까요?','준비됐나요? 출발해요!'][state.step];$('previous').textContent=state.step?'← 이전 단계':'← 처음으로';$('next').classList.toggle('hide',state.step===3);let html='';if(state.step===0){html=setOpts('scope',scopes,()=>setting.scope);if(setting.scope!=='all')html+=`<button class="mini-btn next" id="chooseScope" style="width:100%;margin:0 0 10px">선택한 범위: ${setting.selected.size}개 · 범위 고르기</button>`;}if(state.step===1)html=setOpts('time',[{value:'10',name:'초심자',desc:'문항당 10초',icon:'<img src="assets/art-sprout.png" alt="">'},{value:'5',name:'숙련자',desc:'문항당 5초',icon:'<img src="assets/art-fire.png" alt="">'}],()=>String(setting.seconds));if(state.step===2)html=setOpts('mode',[{value:'10',name:'기본 퀴즈 10문제',desc:'짧고 빠르게 복습',icon:'<img src="assets/art-scroll.png" alt="">'},{value:'20',name:'기본 퀴즈 20문제',desc:'범위를 꼼꼼하게 점검',icon:'<img src="assets/art-book.png" alt="">'},{value:'0',name:'무한 도전',desc:'틀리거나 시간이 끝나면 종료',icon:'<img src="assets/art-cart.png" alt="책 수레">'}],()=>String(setting.mode==='endless'?0:setting.count));if(state.step===3)html=`<div class="ticket"><div class="ticket-row"><b>학습 범위</b><span>${escapeHtml(selectedText())}</span></div><div class="ticket-row"><b>제한 시간</b><span>${setting.seconds}초</span></div><div class="ticket-row"><b>도전 방식</b><span>${setting.mode==='endless'?'무한 도전':'기본 퀴즈 '+setting.count+'문제'}</span></div></div><button class="big-btn red" id="enter" style="margin-top:17px">시험장 입장하기 ❯</button>`;$('settingsContents').innerHTML=html;$('next').disabled=state.step===0&&setting.scope!=='all'&&!setting.selected.size;document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{setting.scope=b.dataset.scope;setting.selected.clear();setupUI();if(setting.scope==='all'){state.step=1;setupUI();}else openScope()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{setting.seconds=+b.dataset.time;state.step=2;setupUI()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const x=+b.dataset.mode;setting.mode=x===0?'endless':'normal';setting.count=x||10;state.step=3;setupUI()});if($('chooseScope'))$('chooseScope').onclick=openScope;if($('enter'))$('enter').onclick=()=>launch()};function escapeHtml(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function openScope(){if(setting.scope==='all')return;const arr=setting.scope==='unit'?units:lessons;$('modalTitle').textContent=setting.scope==='unit'?'단원별 학습 범위':'차시별 학습 범위';$('modalItems').innerHTML=arr.map((t,i)=>`<button data-index="${i}" type="button" class="${setting.selected.has(t)?'active':''}">${escapeHtml(t)}</button>`).join('');for(let b of $('modalItems').querySelectorAll('button'))b.onclick=()=>{const key=arr[+b.dataset.index];if(setting.selected.has(key))setting.selected.delete(key);else setting.selected.add(key);b.classList.toggle('active')};$('modal').classList.remove('hide')};function closeScope(){ $('modal').classList.add('hide');setupUI()};function pool(){if(setting.scope==='all')return [...Q];return Q.filter(q=>setting.selected.has(setting.scope==='unit'?q.unit:q.lesson))}function launch(review=false){let p=review?[...state.wrong]:pool();if(!p.length){alert('출제할 범위를 한 개 이상 선택해 주세요.');return}cancelAnimationFrame(state.raf);state.review=review;state.session=shuffle(p);state.idx=0;state.correct=0;state.wrong=[];state.streak=0;state.best=0;state.endlessSeen.clear();if(setting.mode==='normal'&&!review)state.session=state.session.slice(0,setting.count);show('playing');nextQuestion()}function nextQuestion(){if(state.idx>=state.session.length){if(setting.mode==='endless'&&!state.review){let p=shuffle(pool().filter(x=>!state.endlessSeen.has(x.id)));if(p.length){state.session.push(...p)}else return finish();}else return finish()}const q=state.session[state.idx];if(!q)return finish();state.lock=false;$('counter').textContent=setting.mode==='endless'&&!state.review?'문제 '+(state.idx+1):`문제 ${state.idx+1} / ${state.session.length}`;$('streak').textContent='연속 정답 '+state.streak;$('topic').textContent=q.lesson;$('question').textContent=q.question;$('feedback').textContent='';$('answers').innerHTML='';shuffle(q.options).forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=['① ','② ','③ ','④ '][i]+opt;b.onclick=()=>answer(opt);$('answers').appendChild(b)});$('runner').classList.add('flap');document.getElementById('craneQuiz')?.classList.remove('happy','sad');document.getElementById('craneQuiz').src='assets/crane-read-new.png';$('runner').classList.remove('happy','sad');state.startTime=performance.now();tick()}function tick(){let remain=Math.max(0,setting.seconds-(performance.now()-state.startTime)/1000),pct=remain/setting.seconds;$('clock').textContent=remain.toFixed(1)+'초';$('bar').style.width=(pct*100)+'%';$('runner').style.left=`calc(${(1-pct)*84}% + 48px)`;if(remain<=0){answer(null);return}state.raf=requestAnimationFrame(tick)}function answer(choice){if(state.lock)return;const q=state.session[state.idx];if(!q)return;const spent=(performance.now()-state.startTime)/1000;state.lock=true;cancelAnimationFrame(state.raf);const ok=choice===q.answer&&spent<setting.seconds;for(let b of $('answers').children){b.disabled=true;if(b.textContent.slice(2)===q.answer)b.classList.add('correct');else if(choice!==null&&b.textContent.slice(2)===choice)b.classList.add('wrong')}if(ok){state.correct++;state.streak++;state.best=Math.max(state.best,state.streak);$('feedback').textContent='정답! '+q.explain;document.getElementById('craneQuiz').src='assets/crane-happy-new.png';$('runner').classList.remove('flap');$('runner').classList.add('happy')}else{state.wrong.push(q);state.streak=0;$('feedback').textContent=choice===null?'시간 초과! 정답: '+q.answer:'정답은 '+q.answer+'입니다.';document.getElementById('craneQuiz').src='assets/crane-sad-new.png';$('runner').classList.remove('flap');$('runner').classList.add('sad')}state.endlessSeen.add(q.id);state.idx++;setTimeout(()=>{if(setting.mode==='endless'&&!state.review&&!ok)finish();else nextQuestion()},550)}function determineRank(p){return p>=90?rankList[0]:p>=75?rankList[1]:p>=60?rankList[2]:p>=40?rankList[3]:rankList[4]}function finish(){cancelAnimationFrame(state.raf);show('result');const total=state.correct+state.wrong.length,p=total?Math.round(state.correct/total*100):0,r=determineRank(p);let savedBest=state.best;if(setting.mode==='endless'&&!state.review){try{const key='history-library-best-'+setting.seconds;savedBest=Math.max(Number(localStorage.getItem(key)||0),state.best);localStorage.setItem(key,String(savedBest))}catch(e){}}$('rank').innerHTML=setting.mode==='endless'&&!state.review?'최고 '+state.best+'연속 정답':(r[0].replace('(', '<span class="rank-hanja">(').replace(')', ')</span>'));$('meaning').textContent=setting.mode==='endless'&&!state.review?'기록을 다시 경신해 보세요!':r[1];$('resultMessage').textContent=setting.mode==='endless'&&!state.review?'무한 도전 · '+total+'문제 응답 · 이 기기 최고 '+savedBest+'연속 정답':r[2];$('percent').textContent=p+'%';$('correct').textContent=state.correct;$('wrong').textContent=state.wrong.length;$('thirdLabel').textContent='오답';$('retryWrong').disabled=!state.wrong.length;$('retryWrong').textContent='틀린 문제 복습'+(state.wrong.length?' ('+state.wrong.length+')':'')}function returnSetup(){state.step=0;setupUI();show('setup')};$('goSetup').onclick=returnSetup;$('homeTop').onclick=()=>{cancelAnimationFrame(state.raf);show('welcome')};$('hub').onclick=e=>{if(!$('playing').classList.contains('hide')&&!confirm('현재 도전을 종료하고 역사 학습실로 돌아갈까요?'))e.preventDefault()};$('next').onclick=()=>{if(state.step<3){state.step++;setupUI()}};$('previous').onclick=()=>{if(state.step===0)show('welcome');else{state.step--;setupUI()}};$('modalClose').onclick=closeScope;$('modalDone').onclick=closeScope;$('quit').onclick=()=>{if(confirm('도전을 종료하고 결과를 확인할까요?'))finish()};$('retry').onclick=()=>launch();$('retryWrong').onclick=()=>launch(true);$('newScope').onclick=returnSetup;setupUI();})();
</script>
<style id="v546-wing-cels">
/* Four hand-adjusted wing poses; no rotation of the body, beak, face or scholar cap. */
.bird-run.flap img{animation:none!important;transform:none!important}

<script id="v546-wing-frames">(function(){'use strict';
const runner=document.getElementById('runner'), bird=document.getElementById('craneQuiz');
if(!runner||!bird)return;
const frames=[0,1,2,3].map(n=>'assets/crane-flap-'+n+'.png');
for(const f of frames){const i=new Image();i.src=f;}
let last=-1;
function animate(time){
  if(!document.getElementById('playing').classList.contains('hide') && runner.classList.contains('flap') && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const f=Math.floor(time/165)%frames.length;
    if(f!==last){bird.src=frames[f];last=f;}
  }else{last=-1;}
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
})();</script>
