(()=>{'use strict';const data=window.HISTORY_QUESTIONS||[], $=x=>document.getElementById(x);const state={semester:'all',scope:'all',selections:[],seconds:10,mode:'normal',count:10,pool:[],queue:[],seen:new Set(),index:0,correct:0,streak:0,bestStreak:0,wrong:[],current:null,started:0,locked:false,reviewOnly:false};const show=id=>{['setup','playing','result'].forEach(x=>$(x).classList.toggle('hide',id!==x));window.scrollTo({top:0,left:0,behavior:'instant'})};// 균등 무작위 섞기
function mix(items){let a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function arrange(items){let remaining=mix(items),ordered=[];while(remaining.length){let last=ordered.length?ordered[ordered.length-1].fact:null;let candidate=remaining.findIndex(q=>q.fact!==last);if(candidate<0)candidate=0;ordered.push(remaining.splice(candidate,1)[0])}return ordered}
function pickButtons(container,attr,cb){$(container).addEventListener('click',e=>{let b=e.target.closest('button[data-'+attr+']');if(!b)return;cb(b.dataset[attr]);[...$(container).querySelectorAll('button')].forEach(x=>x.classList.toggle('selected',x===b))})}
function semesterData(){return state.semester==='all'?data:data.filter(q=>q.lesson.startsWith(state.semester+' · '))}function scopes(){return [...new Set(semesterData().map(q=>state.scope==='unit'?q.unit:q.lesson))]}function filtered(){let base=semesterData();if(state.scope==='all')return base;if(!state.selections.length)return [];return base.filter(q=>state.selections.includes(state.scope==='unit'?q.unit:q.lesson))}
function updateAvailability(){let n=filtered().length, f=new Set(filtered().map(q=>q.fact)).size;$('availability').textContent=`선택 범위: ${n}문항 / 핵심 사실 ${f}개 · ${n===0?'범위를 선택해 주세요.':'문항이 부족하면 가능한 문항 수만 출제합니다.'}`;$('start').disabled=!n}
function renderScopes(){let zone=$('scopeItems');zone.innerHTML='';state.selections=[];if(state.scope==='all'){zone.innerHTML='<span class="tiny">선택한 학기의 모든 차시가 포함됩니다.</span>'}else{scopes().forEach(name=>{let b=document.createElement('button');b.className='chip';b.textContent=name;b.onclick=()=>{if(state.scope!=='multi'){state.selections=[name];zone.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}else{state.selections=state.selections.includes(name)?state.selections.filter(x=>x!==name):[...state.selections,name];b.classList.toggle('selected')}updateAvailability()};zone.appendChild(b)});if(state.scope!=='multi'&&zone.firstChild)zone.firstChild.click()}updateAvailability()}
pickButtons('semesters','semester',v=>{state.semester=v;renderScopes()});pickButtons('scopeTypes','scope',v=>{state.scope=v;renderScopes()});pickButtons('difficulties','seconds',v=>{state.seconds=Number(v)});pickButtons('modes','mode',v=>{state.mode=v;$('countBlock').classList.toggle('hide',v==='endless')});pickButtons('counts','count',v=>{state.count=Number(v)});
let frame=0,advanceDelay=0;function stopTimer(){cancelAnimationFrame(frame);clearTimeout(advanceDelay)}function selectNext(){state.index++;if(state.mode==='normal'&&state.index>state.queue.length){finish();return}if(state.mode==='endless'){if(!state.queue.length){state.queue=arrange(state.pool);if(state.current && state.queue.length>1 && state.queue[0].fact===state.current.fact){let i=state.queue.findIndex(x=>x.fact!==state.current.fact);if(i>0)[state.queue[0],state.queue[i]]=[state.queue[i],state.queue[0]]}state.seen.clear()}state.current=state.queue.shift()}else state.current=state.queue[state.index-1];state.locked=false;state.started=performance.now();$('counter').textContent=state.mode==='endless'?`문제 ${state.index}`:`문제 ${state.index} / ${state.queue.length}`;$('combo').textContent=`연속 정답 ${state.streak}`;$('questionScope').textContent=`${state.current.unit} / ${state.current.lesson}`;$('questionText').textContent=state.current.question;$('feedback').textContent='';$('answers').innerHTML='';mix(state.current.options).forEach((choice,i)=>{let b=document.createElement('button');b.className='option';b.textContent=`${['①','②','③','④'][i]}  ${choice}`;b.onclick=()=>answer(choice);b.dataset.value=choice;$('answers').appendChild(b)});tick()}
function tick(){let remaining=Math.max(0,state.seconds-(performance.now()-state.started)/1000);$('clock').textContent=remaining.toFixed(1);$('clock').classList.toggle('urgent',remaining<=3);$('timeFill').style.width=remaining/state.seconds*100+'%';$('horseRunner').style.left='calc('+((1-remaining/state.seconds)*100).toFixed(3)+'% - '+((1-remaining/state.seconds)*58).toFixed(3)+'px)';$('raceTrack').setAttribute('aria-valuenow',String(Math.round(remaining/state.seconds*100)));$('raceTrack').classList.toggle('rush',remaining<=state.seconds*.28);if(remaining<=0){answer(null);return}frame=requestAnimationFrame(tick)}

function percentGrade(correct,total){let p=total?correct/total*100:0;return p>=95?'장원급제':p>=80?'급제':p>=60?'소과 합격':'유생'}

      parts.push(cur);cur=cur.nextElementSibling;
    }
    parts.forEach(node=>page.appendChild(node));steps.push(page);
  });
  const final=document.createElement('section');final.className='wizard-page';final.dataset.wizardStep='4';final.setAttribute('aria-label','응시표 확인');
  const details=document.createElement('div');details.className='wizard-summary';details.innerHTML='<h3>📜 과거시험 응시표</h3><dl><dt>학기</dt><dd id="wsSemester"></dd><dt>학습 범위</dt><dd id="wsScope"></dd><dt>제한 시간</dt><dd id="wsTime"></dd><dt>도전 방식</dt><dd id="wsMode"></dd></dl>';
  final.appendChild(details);
  [document.getElementById('availability'),document.getElementById('start')].forEach(n=>{if(n)final.appendChild(n)});
  steps.push(final);
  const track=document.createElement('div');track.className='wizard-track';track.setAttribute('aria-label','응시 설정 진행 단계');
  const markers=names.map((name,i)=>{const b=document.createElement('button');b.type='button';b.className='wizard-marker';b.textContent=(i+1)+' '+name;track.appendChild(b);return b});
  const nav=document.createElement('div');nav.className='wizard-actions';
  const prev=document.createElement('button');prev.type='button';prev.textContent='← 이전 단계';
  const next=document.createElement('button');next.id='wizardNext';next.type='button';next.textContent='다음 단계 →';
  nav.append(prev,next);
  const hero=setup.querySelector('.hero');hero.after(track);track.after(...steps,nav);
  const hints=['응시할 학기를 선택하세요.','시험 범위를 선택하세요. 여러 차시를 함께 연습할 수도 있어요.','파발마가 달리는 시간을 선택하세요.','시험 문제 수와 도전 방식을 선택하세요.','설정을 확인하고 시험장에 입장하세요.'];
  steps.forEach((page,i)=>{if(i===4)return;const hint=document.createElement('p');hint.className='wizard-hint';hint.textContent=hints[i];page.insertBefore(hint,page.firstElementChild.nextSibling)});
  let active=0,furthest=0;
  const selected=(selector)=>document.querySelector(selector+' .selected');
  const currentScope=()=>selected('#scopeTypes')?.dataset.scope||'all';
  function updateSummary(){
    document.getElementById('wsSemester').textContent=selected('#semesters')?.textContent.trim()||'전체 학기';
    const type=selected('#scopeTypes')?.textContent.trim()||'전체 범위';
    const choices=Array.from(document.querySelectorAll('#scopeItems .selected')).map(x=>x.textContent.trim());
    document.getElementById('wsScope').textContent=currentScope()==='all'?type:type+' · '+(choices.length>3?choices.slice(0,3).join(', ')+' 외 '+(choices.length-3)+'개':choices.join(', '));
    document.getElementById('wsTime').textContent=selected('#difficulties')?.textContent.trim().replace(/\s+/g,' ')||'초심자 10초';
    const mode=selected('#modes')?.dataset.mode||'normal';
    document.getElementById('wsMode').textContent=mode==='endless'?'무한 도전':('기본 퀴즈 · '+(selected('#counts')?.textContent.trim()||'10문제'));
  }
  function valid(){return active!==1 || currentScope()==='all'||document.querySelectorAll('#scopeItems .selected').length>0}
  function showStep(n){
    active=Math.min(4,Math.max(0,n));furthest=Math.max(furthest,active);
    steps.forEach((p,i)=>{p.classList.toggle('active',i===active);p.hidden=i!==active});
    markers.forEach((m,i)=>{m.className='wizard-marker'+(i===active?' current':i<active?' done':'');m.setAttribute('aria-current',i===active?'step':'false');m.disabled=i>active});
    prev.disabled=active===0;next.hidden=active===4;
    next.disabled=!valid();next.textContent=active===1?'선택 완료 →':active===3?'응시표 확인 →':'다음 단계 →';
    if(active===4)updateSummary();
    setup.scrollIntoView({block:'start',behavior:'instant'});
  }
  prev.addEventListener('click',()=>showStep(active-1));next.addEventListener('click',()=>{if(valid())showStep(active+1)});
  markers.forEach((m,i)=>m.addEventListener('click',()=>{if(i<active)showStep(i)}));
  document.getElementById('semesters').addEventListener('click',e=>{if(e.target.closest('[data-semester]')&&active===0)requestAnimationFrame(()=>showStep(1))});
  document.getElementById('scopeTypes').addEventListener('click',e=>{if(e.target.closest('[data-scope]')&&active===1){next.disabled=!valid();if(currentScope()==='all')requestAnimationFrame(()=>showStep(2))}});
  document.getElementById('scopeItems').addEventListener('click',()=>{if(active===1)requestAnimationFrame(()=>{next.disabled=!valid()})});
  document.getElementById('difficulties').addEventListener('click',e=>{if(e.target.closest('[data-seconds]')&&active===2)requestAnimationFrame(()=>showStep(3))});
  document.getElementById('modes').addEventListener('click',e=>{if(e.target.closest('[data-mode]')&&active===3 && selected('#modes')?.dataset.mode==='endless')requestAnimationFrame(()=>showStep(4))});
  document.getElementById('returnSetup').addEventListener('click',()=>showStep(4));
  document.getElementById('backHome').addEventListener('click',()=>showStep(0));
  showStep(0);
})();
</script>
</body></html>
