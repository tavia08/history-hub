<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="history-hub-detective-build" content="precision505-integrated1">
<title>노선생 역사 학습실</title>
  <style>
    :root{
      --bg:#f4f6fb;
      --card:#ffffff;
      --ink:#182033;
      --muted:#6f7788;
      --line:#e6e9f1;
      --accent:#654bff;
      --accent2:#8b5cf6;
      --ok:#2aa879;
      --warn:#d99a2b;
      --shadow:0 8px 28px rgba(31,42,68,.08);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:linear-gradient(180deg,#f7f8fd 0%,var(--bg) 100%);
      color:var(--ink);
    }
    button,input{font:inherit}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
    .hero{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:26px 28px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }
    .brand{display:flex;gap:16px;align-items:center}
    .logo{
      width:58px;height:58px;border-radius:18px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,#ff8b5d,#ff4b88 48%,#6c4dff);
      color:#fff;font-weight:900;font-size:20px;
      box-shadow:0 8px 20px rgba(103,77,255,.22);
    }
    h1{margin:0 0 6px;font-size:30px;letter-spacing:-.6px}
    .sub{color:var(--muted);font-size:15px}
    .user-pill{
      display:flex;align-items:center;gap:10px;
      border:1px solid #e8e5ff;background:#faf9ff;
      color:#5c49cf;border-radius:999px;padding:10px 14px;
      font-weight:800;white-space:nowrap
    }
    .section{margin-top:24px}
    .login-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
    }
    .section-title{font-size:20px;font-weight:900;margin:0 0 8px}
    .section-desc{color:var(--muted);font-size:14px;margin-bottom:18px}
    .login-grid{
      display:grid;
      grid-template-columns:1fr 1fr auto;
      gap:12px;
      align-items:end;
    }
    label{display:block;font-size:13px;font-weight:800;margin:0 0 7px;color:#4e566a}
    input{
      width:100%;height:48px;border-radius:13px;border:1px solid #dfe3ee;
      padding:0 14px;background:#fff;outline:none;
    }
    input:focus{border-color:#8a78ff;box-shadow:0 0 0 3px rgba(101,75,255,.10)}
    .btn{
      height:48px;border:0;border-radius:13px;padding:0 22px;font-weight:900;cursor:pointer;
      transition:.18s ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--accent),#7359ff);color:#fff}
    .btn-soft{background:#f1efff;color:#5f4adb}
    .btn-ghost{background:#f3f5f9;color:#5d6574}
    .login-msg{margin-top:12px;font-size:13px;font-weight:700}
    .login-msg.ok{color:var(--ok)}
    .login-msg.err{color:#d65353}
    .dashboard{display:none}
    .dashboard.show{display:block}
    .hello{
      display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
      margin-bottom:14px
    }
    .hello h2{margin:0 0 6px;font-size:24px}
    .flow{
      color:var(--muted);font-size:14px;line-height:1.6
    }
    .flow b{color:#5147aa}
    .apps{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
      margin-top:18px
    }
    .app-card{
      position:relative;background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;padding:20px;
      min-height:190px;box-shadow:var(--shadow);
      display:flex;flex-direction:column;gap:12px;
      overflow:hidden;
    }
    .app-card::after{
      content:"";position:absolute;right:-28px;top:-28px;width:110px;height:110px;
      border-radius:50%;background:var(--tone,#eee);opacity:.35
    }
    .app-head{display:flex;align-items:center;gap:12px;z-index:1}
    .app-icon{
      width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
      background:var(--tone,#eee);font-size:24px
    }
    .app-title{font-size:18px;font-weight:900}
    .app-desc{color:var(--muted);font-size:13px;line-height:1.5;min-height:38px}
    .app-progress-detail{font-size:12px;font-weight:800;color:#596074;background:#f6f7fb;border:1px solid #eceef5;border-radius:10px;padding:8px 10px}
    .status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
    .badge{
      font-size:12px;font-weight:900;border-radius:999px;padding:6px 9px;
      background:#eef8f3;color:#20805e
    }
    .badge.wait{background:#fff6e7;color:#b57915}
    .go{
      border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer;
      background:#181b22;color:#fff
    }
    .go[disabled]{cursor:not-allowed;opacity:.45}
    .mini{
      margin-top:18px;background:#f8f7ff;border:1px solid #ebe8ff;
      border-radius:18px;padding:15px 17px;color:#625c83;font-size:13px;line-height:1.6
    }
    .footer-note{margin-top:20px;text-align:center;color:#9298a6;font-size:12px}
    @media(max-width:900px){
      .apps{grid-template-columns:repeat(2,minmax(0,1fr))}
      .login-grid{grid-template-columns:1fr 1fr}
      .login-grid .btn{grid-column:1/-1}
      .hero{align-items:flex-start}
    }
    @media(max-width:640px){
      .wrap{padding:16px 12px 34px}
      .hero{padding:20px;flex-direction:column}
      h1{font-size:24px}
      .login-grid{grid-template-columns:1fr}
      .apps{grid-template-columns:1fr}
      .hello{flex-direction:column}
    }
  
    .app-progress-wrap{
      margin-top:2px;
      padding:0 1px;
    }
    .app-progress-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:5px;
      font-size:11px;
      color:#7a8194;
      font-weight:800;
    }
    .app-progress-meta b{
      color:#2f3545;
      font-size:11px;
    }
    .app-progress-bar{
      height:7px;
      overflow:hidden;
      border-radius:999px;
      background:#eceef4;
    }
    .app-progress-bar>div{
      height:100%;
      border-radius:999px;
      background:var(--tone);
      transition:width .35s ease;
    }
    .app-recent{
      font-size:11px;
      line-height:1.45;
      color:#6e7485;
      font-weight:750;
      padding:2px 2px 0;
      min-height:18px;
    }


    .class-mode-banner{
      margin:0 0 16px;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid #e6e8f0;
      background:#fff;
      display:flex;
      gap:10px;
      align-items:flex-start;
      flex-wrap:wrap;
      box-shadow:0 5px 18px rgba(34,43,67,.04);
    }
    .class-mode-banner b{font-size:14px}
    .class-mode-banner span{font-size:12px;line-height:1.55;color:#697083}
    .class-mode-banner.class{background:#fffaf0;border-color:#f0dfb7}
    .class-mode-banner.free{background:#f3fbf6;border-color:#d7ecde}
    .class-mode-banner.open{background:#f6f5ff;border-color:#e4e0ff}
    .app-lock-reason{
      min-height:18px;
      font-size:11px;
      line-height:1.45;
      color:#9a6b18;
      font-weight:800;
      padding:1px 2px 0;
    }


    .lesson-flow{
      display:flex!important;
      align-items:center;
      gap:7px;
      flex-wrap:wrap;
      width:100%;
      margin-top:2px;
    }
    .lesson-flow i{
      font-style:normal;
      padding:6px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      border:1px solid #e5e7eb;
      background:#fff;
      color:#6b7280;
    }
    .lesson-flow i.done{background:#edf9f1;border-color:#cfe9d8;color:#23824a}
    .lesson-flow i.now{background:#fff4d8;border-color:#f1d797;color:#9a6410}
    .lesson-flow i.lock{background:#f5f6f8;color:#9aa0aa}
    .lesson-flow>b{font-size:11px;color:#9aa0aa}
    .step-tag{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:4px 8px;
      border-radius:999px;
      background:#f4f1ff;
      color:#6c55d9;
      font-size:10px;
      font-weight:950;
      margin-left:auto;
    }

</style>

<style id="explorer-hq-v3">

.wrap{max-width:1280px;padding:14px 14px 30px}
.hero{padding:14px 18px;border-radius:18px}

.section.dashboard{margin-top:10px}
.hq-scene{

  border-radius:22px;
  overflow:hidden;

.hq-hotspots{position:absolute!important;inset:0!important;display:block!important;margin:0!important;z-index:6}
/* 카드 UI는 제거하고, 배경 깃발 위 투명 클릭영역만 남김 */
.app-card{position:absolute!important;width:8.8%!important;aspect-ratio:1/1.25;min-width:0!important;min-height:0!important;padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important;overflow:visible!important}
.app-card::after{display:none!important}
.app-card .app-head{position:absolute!important;inset:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;border-radius:16px!important;cursor:pointer!important;font-size:0!important;outline:none!important}
.app-card .app-head:focus-visible{outline:3px solid #ffe08d!important;outline-offset:3px!important}
.app-card .app-icon,.app-card .app-title,.app-card .app-desc,.app-card .app-progress-detail,.app-card .app-progress-wrap,.app-card .app-recent,.app-card .app-lock-reason,.app-card .status-row,.app-card .step-tag{display:none!important}
/* 상태는 깃발 모서리에 작은 원형 표시만 */
.app-card .app-head::after{content:"";position:absolute;right:5%;bottom:4%;width:18px;height:18px;border-radius:50%;background:rgba(40,30,20,.72);border:2px solid rgba(255,239,196,.85);box-shadow:0 2px 7px rgba(0,0,0,.35);opacity:.75}
.app-card.completed-target .app-head::after{content:"✓";display:grid;place-items:center;background:#2b7b4e;color:#fff;font-size:11px;font-weight:1000;border-color:#c7f2d5;opacity:1}
.app-card.current-target .app-head::after{content:"!";display:grid;place-items:center;background:#b47a1c;color:#fff7ce;font-size:12px;font-weight:1000;border-color:#ffe7a0;opacity:1;animation:hqPulse 1.5s ease-in-out infinite}
.app-card.locked .app-head::after{content:"🔒";display:grid;place-items:center;background:rgba(45,39,34,.78);font-size:9px;opacity:.9}
@keyframes hqPulse{50%{transform:scale(1.22);box-shadow:0 0 0 6px rgba(255,214,116,.16)}}

/* 배경 속 실제 깃발 위치 */

/* 하단 미션판 */

.mission-title{display:block;font-size:14px;font-weight:1000}.mission-lesson{display:block;margin-top:1px;font-size:10px;color:#f3dcae;font-weight:850}.mission-flow-line{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;margin-top:5px;font-size:8px;font-weight:900}.mission-flow-line i{font-style:normal;padding:3px 5px;border-radius:999px;background:rgba(255,255,255,.12)}.mission-flow-line i.done{background:#225a3c;color:#bff5d1}.mission-flow-line i.now{background:#8a5d16;color:#fff1b7}.mission-flow-line i.lock{background:rgba(255,255,255,.08);color:#b9ad99}
/* 선택 정보창: 게임 스테이지 상세창처럼 */

const el = (id) => document.getElementById(id);

function getStudent(){
  return {
    studentNo: localStorage.getItem("studentNo") || "",
    studentName: localStorage.getItem("studentName") || "",
    studentId: localStorage.getItem("studentId") || ""
  };
}

function saveStudent(studentNo, studentName){
  const no = studentNo.trim();
  const name = studentName.trim();
  const id = no + "_" + name;

  localStorage.setItem("studentNo", no);
  localStorage.setItem("studentName", name);
  localStorage.setItem("studentId", id);

  return {studentNo:no, studentName:name, studentId:id};
}

function clearStudent(){
  localStorage.removeItem("studentNo");
  localStorage.removeItem("studentName");
  localStorage.removeItem("studentId");
  localStorage.removeItem("historyHubStateV1");
  localStorage.removeItem("historyHubStateStudentId");
  sessionStorage.removeItem("historyHubLoginSessionV1");
}

function validateStudent(no, name){
  if(!no || !name) return "학번과 이름을 모두 입력해주세요.";
  if(!/^[0-9]{4,10}$/.test(no)) return "학번은 숫자로 입력해주세요.";
  if(name.length < 2) return "이름을 확인해주세요.";
  return "";
}


function readHubState(){
  try{
    const hub = JSON.parse(localStorage.getItem("historyHubStateV1") || "null");
    const studentId = localStorage.getItem("studentId") || "";
    if(!hub || !hub.student || hub.student.studentId !== studentId) return null;
    return hub;
  }catch(e){
    return null;
  }
}


function getClassOperation(){
  const hub = readHubState();
  return hub && hub.classOperation ? hub.classOperation : {
    mode:"OPEN",
    worksheetId:"",
    worksheetTitle:"",
    requiredApps:["time_explorer","detective","history_dm"],
    unlockGamesAfterCore:true,
    enabled:false
  };
}

function getWorksheetBundle(){
  const op = getClassOperation();
  return WORKSHEET_BUNDLES[String(op.worksheetId || "").trim()] || null;
}

function recentCompletionHint(appId){
  try{
    const raw=JSON.parse(localStorage.getItem('historyHubCompletionHintV1')||'null');
    const op=getClassOperation();
    if(!raw||raw.app!==appId)return false;
    if(String(raw.worksheetId||'')!==String(op.worksheetId||''))return false;
    return Date.now()-Number(raw.at||0) < 5*60*1000;
  }catch(e){return false}
}

function worksheetStepComplete(appId){
  const hub = readHubState();
  const bundle = getWorksheetBundle();
  if(!hub || !bundle) return false;
  if(recentCompletionHint(appId)) return true;

  if(appId === "time_explorer"){
    const route = bundle.timeExplorer;
    const state = hub.timeExplorer && hub.timeExplorer.state;
    const era = state && state.eras && state.eras[route.era];
    const done = era && Array.isArray(era.completedStages) ? era.completedStages : [];
    return done.includes(route.stage);
  }

  if(appId === "detective"){
    const st = hub.detective && hub.detective.state;
    const done = st && Array.isArray(st.sourceSolved) ? st.sourceSolved : [];
    return (
      done.includes(bundle.detective.ws) ||
      done.includes("SOURCE-" + bundle.detective.ws)
    );
  }

  if(appId === "history_dm"){
    const dm = hub.historyDM || {};
    const topic = dm.topics && dm.topics[bundle.historyDM.topicId];
    const submitted = topic && Array.isArray(topic.submittedQuestions)
      ? topic.submittedQuestions
      : [];
    return ["Q1","Q2","Q3"].every(q => submitted.includes(q));
  }

  return false;
}

function worksheetStepNumber(appId){
  return {
    time_explorer:1,
    detective:2,
    history_dm:3
  }[appId] || null;
}

function worksheetStepStatus(appId){
  const hub=readHubState(); const op=getClassOperation(); const done=worksheetStepComplete(appId);
  if(!hub||op.mode!=="CLASS") return done?"current_done":"pending";
  const session=hub.lessonSession||{};
  if(!session.active||String(session.worksheetId||"")!==String(op.worksheetId||"")) return done?"current_done":"pending";
  const base=session.baseline||{};
  const key={time_explorer:"timeDone",detective:"detectiveDone",history_dm:"dmDone"}[appId];
  if(done&&key&&base[key]) return "existing";
  if(done) return "session_done";
  return "pending";
}
function worksheetStepStatusLabel(appId){
  const s=worksheetStepStatus(appId);
  if(s==="existing") return "기존 완료";
  if(s==="session_done") return "이번 수업 완료";
  if(s==="current_done") return "완료";
  return "미완료";
}

function classAppUrl(app){
  const op = getClassOperation();
  const bundle = getWorksheetBundle();

  if(op.mode !== "CLASS" || !bundle) return app.url;

  const ws = encodeURIComponent(op.worksheetId || "");

  if(app.id === "time_explorer"){
    return `time_explorer/index.html?hubWorksheet=${ws}`;
  }

  if(app.id === "detective"){
    return `detective/index.html?v=precision505-integrated2&hubWorksheet=${ws}`;
  }

  if(app.id === "history_dm"){
    return `history_dm.html?topic=${encodeURIComponent(bundle.historyDM.topicId)}&hubWorksheet=${ws}`;
  }

  return app.url;
}

function coreLearningComplete(){
  const op = getClassOperation();

  if(op.mode === "CLASS" && getWorksheetBundle()){
    return (
      worksheetStepComplete("time_explorer") &&
      worksheetStepComplete("detective") &&
      worksheetStepComplete("history_dm")
    );
  }

  const te = summarizeAppProgress("time_explorer");
  const det = summarizeAppProgress("detective");
  const dm = summarizeAppProgress("history_dm");
  return !!(te.started && det.started && dm.started);
}

function appAccessState(app){
  const op = getClassOperation();

  if(!app.enabled){
    return {enabled:false, reason:"연결 준비 중"};
  }

  if(op.mode === "OPEN"){
    return {enabled:true, reason:""};
  }

  if(op.mode === "FREE"){
    return {
      enabled:!!app.enabled,
      reason:app.enabled ? "" : "연결 준비 중"
    };
  }

  const bundle = getWorksheetBundle();

  if(!bundle){
    const required = ["time_explorer","detective","history_dm"];
    if(required.includes(app.id)){
      return {
        enabled:true,
        reason:"현재 학습지는 세부 콘텐츠 연결 전이라 앱 첫 화면으로 이동해요."
      };
    }
    return {enabled:false, reason:"오늘의 학습지 연결이 완료되면 열려요."};
  }

  if(app.id === "time_explorer"){
    return {enabled:true, reason:""};
  }

  if(app.id === "detective"){
    const ok = worksheetStepComplete("time_explorer");
    return {
      enabled:ok,
      reason:ok ? "" : "① 시간탐험대의 오늘 미션을 먼저 완료하세요."
    };
  }

  if(app.id === "history_dm"){
    const ok = worksheetStepComplete("detective");
    return {
      enabled:ok,
      reason:ok ? "" : "② 역사 탐정사무소의 오늘 사료 수사를 먼저 완료하세요."
    };
  }

  const isGame = app.id === "history_defense" || app.id === "history_survival" || app.id === "history_tycoon" || app.id === "history_sharpshooter";
  if(isGame){
    const unlocked = !!op.unlockGamesAfterCore && coreLearningComplete();
    return {
      enabled:unlocked && app.enabled,
      reason:unlocked ? "" : "①~③ 오늘의 필수 학습을 모두 마치면 열려요."
    };
  }

  return {enabled:false, reason:"오늘 수업에서 사용하지 않는 앱이에요."};
}

function renderClassModeBanner(){
  const op = getClassOperation();
  const bundle = getWorksheetBundle();
  const ws = op.worksheetTitle || (bundle && bundle.title) || op.worksheetId || "오늘의 학습지";
  const lesson = document.getElementById("missionLesson");
  const flow = document.getElementById("missionFlow");
  if(!lesson || !flow) return;

  if(op.mode === "FREE"){
    lesson.textContent = "자유모드 · 원하는 공간을 자유롭게 이용하세요.";
    flow.innerHTML = `<i class="done">시간탐험대</i><i class="done">역사 탐정</i><i class="done">역사 DM</i><i class="done">자유 게임</i>`;
    return;
  }

  if(op.mode === "CLASS"){
    lesson.textContent = `${op.worksheetId || ""} ${ws}`.trim();
    if(bundle){
      const s1 = worksheetStepComplete("time_explorer");
      const s2 = worksheetStepComplete("detective");
      const s3 = worksheetStepComplete("history_dm");
      flow.innerHTML = `
        <i class="${s1?'done':'now'}">① 시간탐험대 ${s1?'✓':''}</i><b>→</b>
        <i class="${s2?'done':(s1?'now':'lock')}">② 역사 탐정 ${s2?'✓':''}</i><b>→</b>
        <i class="${s3?'done':(s2?'now':'lock')}">③ 역사 DM ${s3?'✓':''}</i><b>→</b>
        <i class="${s1&&s2&&s3?'done':'lock'}">🎮 자유 활동</i>`;
    }else{
      flow.innerHTML = `<i class="now">오늘의 학습앱을 확인하세요.</i>`;
    }
    return;
  }

  lesson.textContent = "전체 개방 · 연결된 역사 학습앱을 자유롭게 이용하세요.";
  flow.innerHTML = `<i class="done">모든 연결 앱 이용 가능</i>`;
}

function summarizeAppProgress(appId){
  const hub = readHubState();

  if(!hub){
    return {
      label:"정보 없음",
      detail:"로그인 후 진행정보를 확인합니다.",
      tone:"wait",
      percent:null,
      recent:"",
      started:false
    };
  }

  if(appId === "time_explorer"){
    const te = hub.timeExplorer || {};
    const state = te.state || {};
    const eras = state.eras || {};
    let completed = 0;
    let xp = 0;

    Object.keys(eras).forEach(id=>{
      const era = eras[id] || {};
      completed += Array.isArray(era.completedStages) ? era.completedStages.length : 0;
      xp += Number(era.xp || 0);
    });

    const started = !(te.status === "not_found" || (!completed && !xp));
    const recentEra =
      state.currentEra ||
      state.currentEraId ||
      state.activeEra ||
      "";

    return started
      ? {
          label:"진행 중",
          detail:`완료 미션 ${completed}개 · 경험치 ${xp}`,
          tone:"ok",
          percent:null,
          recent: recentEra ? `최근 활동 · ${recentEra}단원 탐험` : "최근 진행정보가 저장되어 있어요.",
          started:true
        }
      : {
          label:"시작 전",
          detail:"아직 저장된 시간탐험대 기록이 없어요.",
          tone:"wait",
          percent:0,
          recent:"",
          started:false
        };
  }

  if(appId === "detective"){
    const det = hub.detective || {};
    const st = det.state || {};
    const solved = Array.isArray(st.solvedCases) ? st.solvedCases.length : 0;
    const sourceSolved = Array.isArray(st.sourceSolved) ? st.sourceSolved.length : 0;
    const stampCount =
      (Array.isArray(st.stamps) ? st.stamps.length : 0) +
      (Array.isArray(st.sourceStamps) ? st.sourceStamps.length : 0);

    const totalDone = solved + sourceSolved;
    const percent = Math.max(0, Math.min(100, Math.round(totalDone / 75 * 100)));
    const started = !(det.status === "not_found" || (!solved && !sourceSolved && !stampCount));

    let recent = "";
    if(st.lastCase){
      recent = `최근 사건 · CASE ${st.lastCase}`;
    }else if(st.lastSourceCase){
      recent = `최근 대표 사료 · ${st.lastSourceCase}`;
    }

    return started
      ? {
          label:"진행 중",
          detail:`추가 수사 ${solved}/44 · 대표 사료 ${sourceSolved}/31`,
          tone:"ok",
          percent,
          recent,
          started:true
        }
      : {
          label:"시작 전",
          detail:"아직 저장된 수사 기록이 없어요.",
          tone:"wait",
          percent:0,
          recent:"",
          started:false
        };
  }

  if(appId === "history_dm"){
    const dm = hub.historyDM || {};
    const count = Number(dm.submittedCount || 0);
    const percent = Math.max(0, Math.min(100, Math.round(count / 69 * 100)));
    const started = count > 0;

    let recent = "";
    if(started && dm.topics){
      const topics = Object.values(dm.topics);
      topics.sort((a,b)=>{
        const ta = new Date(a.lastUpdatedAt || 0).getTime();
        const tb = new Date(b.lastUpdatedAt || 0).getTime();
        return tb - ta;
      });
      if(topics[0]){
        recent = `최근 제출 · ${topics[0].topicTitle || topics[0].topicId}`;
      }
    }

    return started
      ? {
          label:"진행 중",
          detail:`제출 답안 ${count}/69`,
          tone:"ok",
          percent,
          recent,
          started:true
        }
      : {
          label:"시작 전",
          detail:"아직 제출한 역사 DM 답안이 없어요.",
          tone:"wait",
          percent:0,
          recent:"",
          started:false
        };
  }

  return {
    label: appId === "history_defense" || appId === "history_survival" || appId === "history_tycoon" || appId === "history_sharpshooter" ? "게임 이용 가능" : "이용 가능",
    detail: appId === "history_defense" || appId === "history_survival" || appId === "history_tycoon" || appId === "history_sharpshooter" ? "개인 최고점은 게임에 입장하면 조회됩니다." : "",
    tone: "ok",
    percent:null,
    recent:"",
    started:false
  };
}

let selectedHubAppId = "";

function launchHubApp(app){
  const s=getStudent();
  if(!s.studentId){
    showLogin("메인페이지에서 먼저 로그인해주세요.", false);
    return;
  }

  // v1.3: 어떤 앱이든 실제 입장 버튼을 누르는 순간 관제실 현재 위치를 갱신합니다.
  hubTrackAppLocation(app.id,"open");

  if(app.id === "time_explorer"){
    // 같은 태블릿에 남아 있는 이전 학생의 시간탐험대 identity보다
    // 현재 역사 학습실 로그인 학생을 항상 우선합니다.
    const digits=String(s.studentNo||"").replace(/\D/g,"");
    let grade=3, classNo="", number="";
    if(digits.length===5){
      grade=Number(digits.slice(0,1));
      classNo=Number(digits.slice(1,3));
      number=Number(digits.slice(3,5));
    }else if(digits.length===4){
      grade=Number(digits.slice(0,1));
      classNo=Number(digits.slice(1,2));
      number=Number(digits.slice(2,4));
    }
    const currentTimeStudent={
      grade,
      classNo,
      number,
      studentNo:s.studentNo,
      studentName:s.studentName,
      studentId:s.studentId
    };
    localStorage.setItem(
      "historyTimeExplorersStudentIdentityV1",
      JSON.stringify(currentTimeStudent)
    );
    // 기존 학생의 탭 세션은 폐기합니다.
    // 시간탐험대가 새 identity에 맞는 세션 토큰을 즉시 다시 생성합니다.
    sessionStorage.removeItem("historyTimeExplorersStudentSessionV1");
    setTimeout(()=>{ window.location.href=classAppUrl(app); },120);
    return;
  }

  if(app.id === "history_survival"){
    if(sessionStorage.getItem("historyHubLoginSessionV1") !== s.studentId){showLogin("로그인 상태를 다시 확인해주세요.",false);return;}
    if(!window.HDSurvivalHubLaunch){alert("서바이벌 로그인 모듈을 불러오지 못했습니다.");return;}
    window.HDSurvivalHubLaunch.open({studentNo:s.studentNo,studentName:s.studentName},app.url).catch(e=>alert("서바이벌 연결 실패: "+e.message));
    return;
  }
  if(app.id === "history_defense"){
    if(sessionStorage.getItem("historyHubLoginSessionV1") !== s.studentId){showLogin("로그인 상태를 다시 확인해주세요.", false);return;}
    if(!window.HDHubLaunch513){alert("디펜스 통합 로그인 모듈이 로드되지 않았습니다.");return;}
    window.HDHubLaunch513.openDefense({studentNo:s.studentNo,studentName:s.studentName},app.url)
      .catch(err=>alert("역사 디펜스 연결 실패: "+err.message));
    return;
  }
  if(app.id === "history_tycoon"){
    if(sessionStorage.getItem("historyHubLoginSessionV1") !== s.studentId){showLogin("로그인 상태를 다시 확인해주세요.",false);return;}
    const handoff=new URL(app.url);
    const h=new URLSearchParams({bridge:"tycoon-s1",no:s.studentNo,name:s.studentName,id:s.studentId,back:location.href});
    handoff.hash=h.toString();
    setTimeout(()=>window.location.assign(handoff.href),250);
    return;
  }
  setTimeout(()=>{ window.location.href = classAppUrl(app); },120);
}

function selectHubApp(app){
  selectedHubAppId = app.id;
  const progress = summarizeAppProgress(app.id);
  const access = appAccessState(app);
  const stepNo = getClassOperation().mode === "CLASS" ? worksheetStepNumber(app.id) : null;
  const stepDone = stepNo ? worksheetStepComplete(app.id) : false;

  el("infoIcon").textContent = app.icon;
  el("infoName").textContent = app.name;
  el("infoStep").textContent = stepNo ? `${stepNo}단계 · ${worksheetStepStatusLabel(app.id)}` : "";
  el("infoDesc").textContent = app.description;
  el("infoDetail").textContent = progress.detail || (app.enabled ? "현재 이용 가능한 역사 학습앱입니다." : "현재 개발 및 연결 준비 중입니다.");
  el("infoRecent").textContent = progress.recent || "";
  el("infoReason").textContent = !access.enabled ? (access.reason || "") : "";
  el("infoStatus").textContent = stepDone ? worksheetStepStatusLabel(app.id) : (access.enabled ? progress.label : (app.enabled ? "잠김" : "준비 중"));

  const enter = el("infoEnter");
  enter.disabled = !access.enabled;
  enter.textContent = !app.enabled ? "준비 중" : (!access.enabled ? "현재 잠김" : (stepDone ? "복습하기 →" : (progress.started ? "이어하기 →" : "시작하기 →")));
  enter.onclick = () => { if(access.enabled) launchHubApp(app); };

  const panel = el("appInfoPanel");
  panel.classList.add("show");
  panel.setAttribute("aria-hidden","false");
  const scene=document.querySelector(".hq-scene");
  if(scene)scene.classList.add("popup-open");

  document.querySelectorAll(".app-card").forEach(c=>c.classList.remove("selected"));
  const card=document.querySelector(`.app-${app.id}`);
  if(card)card.classList.add("selected");
}

function renderApps(){
  const grid = el("appsGrid");
  grid.innerHTML = "";
  renderClassModeBanner();

  const op = getClassOperation();

  APPS.forEach(app => {
    const access = appAccessState(app);
    const stepNo = op.mode === "CLASS" ? worksheetStepNumber(app.id) : null;
    const stepDone = stepNo ? worksheetStepComplete(app.id) : false;

    const card = document.createElement("article");
    card.className = "app-card app-" + app.id + (access.enabled ? "" : " locked");

    if(stepDone) card.classList.add("completed-target");
    if(stepNo && !stepDone){
      const previousDone = stepNo===1 || (stepNo===2 && worksheetStepComplete("time_explorer")) || (stepNo===3 && worksheetStepComplete("detective"));
      if(previousDone) card.classList.add("current-target");
    }

    card.innerHTML = `
      <button class="app-head" type="button" aria-label="${app.name} 정보 보기">
        <span class="app-icon">${app.icon}</span>
        <span class="app-title">${app.name}</span>
      </button>`;

    card.querySelector(".app-head").addEventListener("click", ()=>selectHubApp(app));
    grid.appendChild(card);
  });

  if(selectedHubAppId){
    const current=APPS.find(a=>a.id===selectedHubAppId);
    if(current) selectHubApp(current);
  }
}

el("closeInfoPanel").addEventListener("click", ()=>{
  const panel=el("appInfoPanel");
  panel.classList.remove("show");
  panel.setAttribute("aria-hidden","true");
  const scene=document.querySelector(".hq-scene");
  if(scene)scene.classList.remove("popup-open");
  selectedHubAppId="";
});

// v1.2: 관제실용 마지막 위치 기록. 로그인 검증은 공통 Apps Script에서 다시 수행합니다.
function hubTrackAppLocation(appId,event='open',orderNo=0){
  const s=getStudent();
  if(!s.studentId)return;

  const params=new URLSearchParams({
    action:'recordAppLocation',
    studentNo:s.studentNo,
    studentName:s.studentName,
    studentId:s.studentId,
    appId,
    event,
    orderNo:String(orderNo),
    _:String(Date.now())
  });

  const url=RECORD_SERVER_URL+'?'+params.toString();

  // 페이지 이동 직전에도 가능한 한 전송이 유지되도록 keepalive GET을 우선 사용합니다.
  try{
    fetch(url,{method:'GET',mode:'no-cors',cache:'no-store',keepalive:true}).catch(()=>{});
  }catch(e){}

  // 구형 브라우저/일부 태블릿 대비 보조 전송
  try{
    const img=new Image();
    img.src=url;
  }catch(e){}
}

const RECORD_SERVER_URL = "https://script.google.com/macros/s/AKfycbxjSzjvqHbrKpCjwnUbsGzYvqDvTdfVB8DUxkki5TXp-jX0wqfmlydpC7DWOIB14oLF2A/exec";
let loginJsonpCounter = 0;

function setLoginBusy(isBusy){
  const btn = el("loginBtn");
  btn.disabled = isBusy;
  btn.textContent = isBusy ? "확인 중..." : "학습 시작";
}

function verifyLoginWithServer(studentNo, studentName){
  return new Promise((resolve, reject) => {
    const callbackName = "__historyLoginCb_" + Date.now() + "_" + (++loginJsonpCounter);
    const script = document.createElement("script");
    let finished = false;

    const cleanup = () => {
      if(finished) return;
      finished = true;
      clearTimeout(timer);
      try { delete window[callbackName]; } catch(e) { window[callbackName] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    };

    window[callbackName] = (payload) => {
      if(finished) return;
      cleanup();
      resolve(payload);
    };

    const timer = setTimeout(() => {
      if(finished) return;
      cleanup();
      reject(new Error("로그인 서버 응답 시간이 초과되었습니다."));
    }, 12000);

    const params = new URLSearchParams({
      action: "loginHub",
      studentNo: studentNo,
      studentName: studentName,
      callback: callbackName,
      _: Date.now().toString()
    });

    script.src = RECORD_SERVER_URL + "?" + params.toString();
    script.async = true;
    script.onerror = () => {
      if(finished) return;
      cleanup();
      reject(new Error("로그인 서버에 연결하지 못했습니다."));
    };

    document.head.appendChild(script);
  });
}

el("loginBtn").addEventListener("click", async () => {
  const no = el("studentNo").value.trim();
  const name = el("studentName").value.trim();
  const error = validateStudent(no, name);

  if(error){
    el("loginMsg").textContent = error;
    el("loginMsg").className = "login-msg err";
    return;
  }

  setLoginBusy(true);
  el("loginMsg").textContent = "학생명단과 학습 진행정보를 불러오고 있습니다.";
  el("loginMsg").className = "login-msg";

  try{
    const result = await verifyLoginWithServer(no, name);

    if(!result || result.status !== "ok" || !result.student){
      throw new Error((result && result.message) || "학번과 이름을 확인해주세요.");
    }

    const verified = result.student;
    const student = saveStudent(
      String(verified.studentNo || no),
      String(verified.studentName || name)
    );

    if(verified.studentId){
      localStorage.setItem("studentId", String(verified.studentId));
      student.studentId = String(verified.studentId);
    }

    // 로그인 상태 자체는 이 브라우저 탭/창을 닫을 때 끝납니다.
    // 진행 캐시는 localStorage에 남지만 다음 접속 때 서버에서 다시 최신 정보를 불러옵니다.
    sessionStorage.setItem("historyHubLoginSessionV1", student.studentId);

    if(result.hubState){
      const hubState = Object.assign({}, result.hubState, {
        loadedAt: Date.now()
      });
      localStorage.setItem("historyHubStateV1", JSON.stringify(hubState));
      localStorage.setItem("historyHubStateStudentId", student.studentId);
    }else{
      localStorage.removeItem("historyHubStateV1");
      localStorage.removeItem("historyHubStateStudentId");
    }

    el("loginMsg").textContent = "로그인과 학습정보 불러오기가 완료되었습니다.";
    el("loginMsg").className = "login-msg ok";
    showDashboard(student);
  }catch(err){
    el("loginMsg").textContent = err.message || "로그인 확인에 실패했습니다.";
    el("loginMsg").className = "login-msg err";
  }finally{
    setLoginBusy(false);
  }
});

el("studentName").addEventListener("keydown", e => {

el("studentNo").addEventListener("keydown", e => {

let classOperationPollTimer = null;
let classOperationJsonpSeq = 0;
let hubStateRefreshSeq = 0;

function refreshFullHubStateFromServer(){
  const studentNo=String(localStorage.getItem("studentNo")||"").trim();
  const studentName=String(localStorage.getItem("studentName")||"").trim();
  if(!studentNo || !studentName) return Promise.resolve(false);

  return new Promise(resolve=>{
    const callbackName="__hubRefreshCb_"+Date.now()+"_"+(++hubStateRefreshSeq);
    const script=document.createElement("script");
    let finished=false;
    const cleanup=()=>{
      if(finished)return; finished=true; clearTimeout(timer);
      try{delete window[callbackName]}catch(e){window[callbackName]=undefined}
      if(script.parentNode)script.parentNode.removeChild(script);
    };
    window[callbackName]=payload=>{
      if(finished)return; cleanup();
      if(payload && payload.status==="ok" && payload.hubState){
        localStorage.setItem("historyHubStateV1",JSON.stringify(payload.hubState));
        localStorage.setItem("historyHubStateStudentId",String(payload.student?.studentId||""));
        renderApps(); resolve(true);
      }else resolve(false);
    };
    const timer=setTimeout(()=>{cleanup();resolve(false)},9000);
    const params=new URLSearchParams({action:"loginHub",studentNo,studentName,callback:callbackName,_:String(Date.now())});
    script.src=RECORD_SERVER_URL+"?"+params.toString(); script.async=true;
    script.onerror=()=>{cleanup();resolve(false)}; document.head.appendChild(script);
  });
}


function refreshClassOperationFromServer(){
  const hub = readHubState();
  if(!hub || !hub.student || !hub.student.classNo) return Promise.resolve(false);

  return new Promise(resolve => {
    const callbackName = "__classOpCb_" + Date.now() + "_" + (++classOperationJsonpSeq);
    const script = document.createElement("script");
    let finished = false;

    const cleanup = () => {
      if(finished) return;
      finished = true;
      clearTimeout(timer);
      try{ delete window[callbackName]; }catch(e){ window[callbackName] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    };

    window[callbackName] = payload => {
      if(finished) return;
      cleanup();

      if(payload && payload.status === "ok" && payload.operation){
        const latestHub = readHubState();
        if(latestHub){
          latestHub.classOperation = payload.operation;
          latestHub.loadedAt = Date.now();
          localStorage.setItem("historyHubStateV1", JSON.stringify(latestHub));
          renderApps();
        }
        resolve(true);
      }else{
        resolve(false);
      }
    };

    const timer = setTimeout(() => {
      cleanup();
      resolve(false);
    }, 7000);

    const params = new URLSearchParams({
      action:"classOperation",
      classNo:String(hub.student.classNo),
      callback:callbackName,
      _:Date.now().toString()
    });

    script.src = RECORD_SERVER_URL + "?" + params.toString();
    script.async = true;
    script.onerror = () => {
      cleanup();
      resolve(false);
    };
    document.head.appendChild(script);
  });
}

function startClassOperationPolling(){
  if(classOperationPollTimer) clearInterval(classOperationPollTimer);
  refreshClassOperationFromServer();
  classOperationPollTimer = setInterval(() => {
    if(document.visibilityState === "visible"){
      refreshFullHubStateFromServer().then(ok=>{ if(!ok) refreshClassOperationFromServer(); });
    }
  }, 10000);
}

window.addEventListener("focus", () => {
  refreshFullHubStateFromServer().then(ok=>{ if(!ok) refreshClassOperationFromServer(); });
  if(getStudent().studentId) hubTrackAppLocation("history_hub","return");
});
window.addEventListener("pageshow", () => {
  refreshFullHubStateFromServer().then(ok=>{ if(!ok) refreshClassOperationFromServer(); });
  if(getStudent().studentId) hubTrackAppLocation("history_hub","return");
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && getStudent().studentId){
    hubTrackAppLocation("history_hub","return");
  }
});

function startFastReturnRefresh(){
  const from=new URLSearchParams(location.search).get('from');
  if(!from)return;
  let n=0;
  const run=()=>{n++;refreshFullHubStateFromServer().then(()=>{});if(n>=8)clearInterval(timer)};
  run();
  const timer=setInterval(run,1500);
}
startFastReturnRefresh();

(function init(){
  const s = getStudent();
  const activeSessionId = sessionStorage.getItem("historyHubLoginSessionV1") || "";

  // 이전 수업에서 창을 닫지 않고 localStorage만 남아 있는 경우
  // 자동 로그인하지 않고 다시 학생 인증부터 시작합니다.
  if(
    s.studentNo &&
    s.studentName &&
    s.studentId &&
    activeSessionId === s.studentId
  ){
    showDashboard(s);
  }else{
    if(s.studentNo || s.studentName || s.studentId){
      clearStudent();
    }
    showLogin();
  }
})();

document.querySelector(".hq-scene")?.addEventListener("click",(e)=>{
  const panel=el("appInfoPanel");
  if(!panel || !panel.classList.contains("show")) return;
  if(panel.contains(e.target)) return;
  if(e.target.closest(".app-card")) return;
  panel.classList.remove("show");
  panel.setAttribute("aria-hidden","true");
  document.querySelector(".hq-scene")?.classList.remove("popup-open");

});

</script>

<script id="palace-hq-operation-mode-fix-v1">
function getClassOperation(){
  const hub = readHubState();
  return hub && hub.classOperation ? hub.classOperation : {
    mode:"LOADING",
    worksheetId:"",
    worksheetTitle:"",
    requiredApps:["time_explorer","detective","history_dm"],
    unlockGamesAfterCore:true,
    enabled:false
  };
}

function renderClassModeBanner(){
  const op = getClassOperation();
  const bundle = getWorksheetBundle();
  const ws = op.worksheetTitle || (bundle && bundle.title) || op.worksheetId || "오늘의 학습지";
  const lesson = document.getElementById("missionLesson");
  const flow = document.getElementById("missionFlow");
  if(!lesson || !flow) return;

  if(op.mode === "LOADING"){
    lesson.textContent = "수업 운영정보를 불러오는 중입니다.";
    flow.innerHTML = `<i class="now">교사 수업모드를 확인하고 있어요.</i>`;
    return;
  }
  if(op.mode === "FREE"){
    lesson.textContent = "자유모드 · 원하는 공간을 자유롭게 이용하세요.";
    flow.innerHTML = `<i class="done">시간탐험대</i><i class="done">역사 탐정</i><i class="done">역사 DM</i><i class="done">자유 게임</i>`;
    return;
  }
  if(op.mode === "CLASS"){
    lesson.textContent = `${op.worksheetId || ""} ${ws}`.trim();
    if(bundle){
      const s1 = worksheetStepComplete("time_explorer");
      const s2 = worksheetStepComplete("detective");
      const s3 = worksheetStepComplete("history_dm");
      flow.innerHTML = `
        <i class="${s1?'done':'now'}">① 시간탐험대 ${s1?'✓':''}</i><b>→</b>
        <i class="${s2?'done':(s1?'now':'lock')}">② 역사 탐정 ${s2?'✓':''}</i><b>→</b>
        <i class="${s3?'done':(s2?'now':'lock')}">③ 역사 DM ${s3?'✓':''}</i><b>→</b>
        <i class="${s1&&s2&&s3?'done':'lock'}">🎮 자유 활동</i>`;
    }else{
      flow.innerHTML = `<i class="now">오늘의 학습앱을 확인하세요.</i>`;
    }
    return;
  }
  if(op.mode === "OPEN"){
    lesson.textContent = "전체개방 · 모든 공간을 자유롭게 이용할 수 있습니다.";
    flow.innerHTML = `<i class="done">모든 연결 앱 이용 가능</i>`;
    return;
  }
  lesson.textContent = "수업 운영정보를 불러오지 못했습니다.";
  flow.innerHTML = `<i class="lock">잠시 후 다시 시도하세요.</i>`;
}

function refreshOperationImmediately(){
  return refreshFullHubStateFromServer().then(ok => {
    if(ok) return true;
    return refreshClassOperationFromServer();
  }).catch(() => false);
}

function showDashboard(student){
  el("loginSection").style.display = "none";
  el("dashboard").classList.add("show");
  el("userPill").style.display = "flex";
  el("pillText").textContent = `${student.studentNo} ${student.studentName}`;
  el("helloName").textContent = student.studentName;
  renderApps();
  hubTrackAppLocation("history_hub","return");
  refreshOperationImmediately();
  startClassOperationPolling();
}

function startClassOperationPolling(){
  if(classOperationPollTimer) clearInterval(classOperationPollTimer);
  refreshOperationImmediately();
  classOperationPollTimer = setInterval(() => {
    if(document.visibilityState === "visible"){
      refreshOperationImmediately();
    }
  }, 10000);
}
</script>
